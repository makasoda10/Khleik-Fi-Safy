<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خليك ف صفي علشان هصفي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #071018;
      color: white;
      font-family: Arial, Tahoma, sans-serif;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #ffc52b;
      font-size: 24px;
      margin: 0;
    }

    .status {
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 20px;
      background: #3d1c20;
      color: #ff7885;
    }

    .card {
      background: linear-gradient(145deg,#12212d,#09131b);
      border: 1px solid #263d4e;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .center {
      text-align: center;
    }

    .logo {
      font-size: 70px;
      margin: 20px 0;
    }

    h2 {
      color: #ffc52b;
      font-size: 28px;
    }

    p {
      color: #91a3b1;
      line-height: 1.7;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      margin-top: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #ffc52b;
      color: #111;
    }

    .secondary {
      background: #122a3c;
      color: white;
      border: 1px solid #355269;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 13px;
      border: 1px solid #355269;
      background: #07131c;
      color: white;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    .hidden {
      display: none;
    }

    .room {
      font-size: 42px;
      letter-spacing: 7px;
      color: #ffc52b;
      text-align: center;
      font-weight: bold;
      margin: 25px 0;
    }

    .characters {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .character {
      background: #10202b;
      border: 1px solid #304858;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
    }

    .avatar {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      background: #172a38;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffc52b;
      font-size: 20px;
      font-weight: bold;
    }

    .character.selected {
      border: 2px solid #ffc52b;
    }

    .character.eliminated {
      opacity: .2;
      filter: grayscale(1);
    }

    .name {
      font-size: 11px;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      background: #07131c;
      color: white;
      border: 1px solid #355269;
      font-size: 16px;
      resize: vertical;
    }

    .turn {
      text-align: center;
      background: #3b300c;
      color: #ffd764;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .message {
      background: #122b3b;
      padding: 10px;
      border-radius: 10px;
      margin-top: 7px;
      font-size: 14px;
    }

    .mine {
      background: #40350d;
    }

    @media(max-width:350px) {
      .characters {
        grid-template-columns: repeat(3,1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🎭 خليك ف صفي</h1>
    <div id="connection" class="status">
      غير متصل
    </div>
  </header>

  <!-- الرئيسية -->

  <section id="home">

    <div class="card center">

      <div class="logo">🎭</div>

      <h2>
        خليك ف صفي<br>
        علشان هصفي
      </h2>

      <p>
        لعبة تخمين الشخصيات المصرية
        <br>
        1 ضد 1
      </p>

      <button
        class="primary"
        onclick="createGame()">
        🎮 إنشاء مباراة
      </button>

      <button
        class="secondary"
        onclick="showJoin()">
        🔑 الانضمام لمباراة
</button>
</section>
</div>

<script>
let ws;
let player = 0;
let room = "";
let selected = null;

const characters = [
"عادل إمام","أحمد زكي","محمود عبد العزيز","نور الشريف",
"يحيى الفخراني","سعاد حسني","فاتن حمامة","شادية",
"يسرا","ليلى علوي","إسعاد يونس","إلهام شاهين",
"أحمد حلمي","كريم عبد العزيز","أحمد السقا","محمد هنيدي",
"خالد النبوي","محمد منير","عمرو دياب","محمد فؤاد",
"تامر حسني","هاني شاكر","أنغام","شيرين عبد الوهاب",
"لطيفة","رامي جمال","أمير كرارة","مي عز الدين",
"منى زكي","هند صبري"
];

function connect() {
  ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") +
    location.host
  );

  ws.onopen = () => {
    document.getElementById("connection").textContent = "متصل 🟢";
    document.getElementById("connection").style.background = "#123d25";
    document.getElementById("connection").style.color = "#55e889";
  };

  ws.onclose = () => {
    document.getElementById("connection").textContent = "غير متصل";
  };

  ws.onmessage = e => {
    const m = JSON.parse(e.data);

    if (m.type === "created") {
      room = m.room;
      player = m.player;
      showRoom();
    }

    if (m.type === "joined") {
      player = m.player;
      if (m.players === 2) showCharacters();
      else showRoom();
    }

    if (m.type === "room_ready") {
      showCharacters();
    }

    if (m.type === "game_start") {
      showGame(m.turn);
    }

    if (m.type === "question") {
      addMessage("سؤال: " + m.text);
    }

    if (m.type === "answer") {
      addMessage("إجابة: " + m.text);
    }

    if (m.type === "turn") {
      addMessage(m.player === player ? "دورك الآن 🎯" : "دور الخصم");
    }

    if (m.type === "winner") {
      alert(m.player === player ? "🎉 كسبت!" : "😅 الخصم كسب!");
    }

    if (m.type === "error") {
      alert(m.message);
    }
  };
}

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify(data));
  else
    alert("الاتصال بالسيرفر لم يتم بعد.");
}

function createGame() {
  send({type:"create"});
}

function showJoin() {
  document.getElementById("home").innerHTML = `
    <div class="card center">
      <h2>الانضمام لمباراة 🔑</h2>
      <input id="roomInput" placeholder="اكتب كود الغرفة">
      <button class="primary" onclick="joinGame()">دخول المباراة</button>
      <button class="secondary" onclick="location.reload()">رجوع</button>
    </div>`;
}

function joinGame() {
  const code = document.getElementById("roomInput").value.trim();
  if (!code) return alert("اكتب كود الغرفة");
  send({type:"join", room:code});
  room = code.toUpperCase();
}

function showRoom() {
  document.getElementById("home").innerHTML = `
    <div class="card center">
      <h2>تم إنشاء المباراة 🎮</h2>
      <div class="room">${room}</div>
      <p>ابعت كود الغرفة للاعب الثاني</p>
      <p>في انتظار اللاعب الثاني...</p>
    </div>`;
}

function showCharacters() {
  let html = `
    <div class="card">
      <h2 class="center">اختار الشخصية السرية 🎭</h2>
      <p class="center">اختار شخصية واحدة ثم اضغط تأكيد</p>
      <div class="characters">`;

  characters.forEach((name,i) => {
    html += `
      <div class="character" onclick="selectCharacter(${i},this)">
        <div class="avatar">${i+1}</div>
        <div class="name">${name}</div>
      </div>`;
  });

  html += `
      </div>
      <button class="primary" onclick="confirmCharacter()">
        تأكيد الشخصية
      </button>
    </div>`;

  document.getElementById("home").innerHTML = html;
}

function selectCharacter(i,el) {
  selected = i;
  document.querySelectorAll(".character")
    .forEach(x => x.classList.remove("selected"));
  el.classList.add("selected");
}

function confirmCharacter() {
  if (selected === null)
    return alert("اختار شخصية الأول");
  send({
    type:"secret_selected",
    character:selected
  });
  document.getElementById("home").innerHTML = `
    <div class="card center">
      <h2>تم اختيار الشخصية ✅</h2>
      <p>في انتظار اللاعب الآخر...</p>
    </div>`;
}

function showGame(turn) {
  document.getElementById("home").innerHTML = `
    <div class="card">
      <div class="turn">
        ${turn === player ? "دورك 🎯" : "دور الخصم"}
      </div>

      <h2 class="center">اللعبة بدأت 🔥</h2>

      <textarea id="question"
        placeholder="اكتب سؤالك هنا..."></textarea>

      <button class="primary" onclick="sendQuestion()">
        إرسال السؤال
      </button>

      <div id="messages"></div>
    </div>`;
}

function sendQuestion() {
  const box = document.getElementById("question");
  if (!box || !box.value.trim()) return;
  send({
    type:"question",
    text:box.value.trim()
  });
  box.value = "";
}

function addMessage(text) {
  const box = document.getElementById("messages");
  if (box)
    box.innerHTML += `<div class="message">${text}</div>`;
}

connect();
</script>

</body>
</html>
