<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خليك في صفي 🎭</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #10131a;
      color: #fff;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #191e29;
      border: 1px solid #2d3545;
      border-radius: 18px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .center {
      text-align: center;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aeb7c7;
      margin-bottom: 25px;
    }

    input,
    textarea {
      width: 100%;
      background: #0f131b;
      color: white;
      border: 1px solid #3a4354;
      border-radius: 12px;
      padding: 14px;
      font-size: 17px;
      outline: none;
      margin-bottom: 12px;
    }

    input:focus,
    textarea:focus {
      border-color: #6c8cff;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 17px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .primary {
      background: #526dff;
      color: white;
    }

    .secondary {
      background: #303746;
      color: white;
    }

    .danger {
      background: #c53b4b;
      color: white;
    }

    .success {
      background: #2e9d67;
      color: white;
    }

    .room {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 5px;
      color: #6f8cff;
      margin: 20px 0;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #252c3a;
      color: #c8d0df;
      margin-bottom: 15px;
      text-align: center;
    }

    .turn {
      background: #252c3a;
      border-radius: 12px;
      padding: 13px;
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .characters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .character {
      background: #242a37;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: .15s;
    }

    .character:hover {
      transform: translateY(-2px);
    }

    .character.selected {
      border-color: #6d89ff;
      background: #303b5a;
    }

    .character.eliminated {
      opacity: .25;
      text-decoration: line-through;
      filter: grayscale(1);
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #3b4660;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 20px;
      font-weight: bold;
    }

    .name {
      margin-top: 8px;
      font-size: 14px;
    }

    .message {
      background: #252c3a;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }

    .question-box {
      margin-top: 20px;
    }

    .guess-box {
      background: #202632;
      border-radius: 14px;
      padding: 18px;
      margin-top: 20px;
    }

    .attempts {
      text-align: center;
      font-size: 18px;
      margin: 12px 0;
    }

    .small {
      color: #9fa9ba;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .characters {
        grid-template-columns: repeat(2, 1fr);
      }

      .container {
        padding: 12px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div id="home"></div>
</div>

<script>

  /* =========================
     بيانات اللعبة
  ========================= */

  const characters = [
    "أحمد",
    "محمد",
    "محمود",
    "عمر",
    "يوسف",
    "علي",
    "حسن",
    "حسين",
    "كريم",
    "خالد",
    "طارق",
    "سامح",
    "شريف",
    "إسلام",
    "مصطفى",
    "عمرو",
    "رامي",
    "أحمد حسن",
    "محمد علي",
    "محمود سامي",
    "عمر خالد",
    "يوسف أحمد",
    "كريم محمد",
    "خالد حسن",
    "طارق علي",
    "شريف محمود",
    "رامي أحمد",
    "سامح عمر",
    "علي حسن",
    "مصطفى محمد"
  ];

  let socket = null;

  let room = "";
  let player = null;

  let selected = null;

  let mySecret = null;
  let opponentSecret = null;

  let currentTurn = null;

  let eliminated = [];

  let attempts = 3;

  let gameStarted = false;

  let connected = false;


  /* =========================
     الصفحة الرئيسية
  ========================= */

  function showHome() {

    document.getElementById("home").innerHTML = `

      <div class="card center">

        <div class="logo">
          خليك في صفي 🎭
        </div>

        <div class="subtitle">
          لعبة تخمين الشخصية — لاعب ضد لاعب
        </div>

        <button class="primary" onclick="createGame()">
          إنشاء مباراة 🎮
        </button>

        <button class="secondary" onclick="showJoin()">
          الانضمام لمباراة 🔑
        </button>

        <div id="connectionStatus" class="status">
          جاري الاتصال بالخادم...
        </div>

      </div>
    `;
  }


  /* =========================
     شاشة الدخول
  ========================= */

  function showJoin() {

    document.getElementById("home").innerHTML = `

      <div class="card center">

        <h2>
          الانضمام لمباراة 🔑
        </h2>

        <input
          id="roomInput"
          placeholder="اكتب كود الغرفة"
          maxlength="10"
        >

        <button
          class="primary"
          onclick="joinGame()"
        >
          دخول المباراة
        </button>

        <button
          class="secondary"
          onclick="showHome()"
        >
          رجوع
        </button>

      </div>

    `;
  }


  /* =========================
     إنشاء مباراة
  ========================= */

  function createGame() {

    if (!connected) {
      alert("لسه جاري الاتصال بالخادم، حاول بعد ثواني.");
      return;
    }

    send({
      type: "create"
    });

  }


  /* =========================
     الانضمام
  ========================= */

  function joinGame() {

    const box = document.getElementById("roomInput");

    if (!box) return;

    const code = box.value.trim().toUpperCase();

    if (!code) {
      alert("اكتب كود الغرفة");
      return;
    }

    room = code;

    send({
      type: "join",
      room: code
    });

  }


  /* =========================
     انتظار اللاعب الثاني
  ========================= */

  function showRoom() {

    document.getElementById("home").innerHTML = `

      <div class="card center">

        <h2>
          تم إنشاء المباراة 🎮
        </h2>

        <div class="room">
          ${room}
        </div>

        <p>
          ابعت كود الغرفة للاعب الثاني
        </p>

        <div class="status">
          في انتظار اللاعب الثاني...
        </div>

      </div>

    `;

  }


  /* =========================
     اختيار الشخصية
  ========================= */

  function showCharacters() {

    selected = null;

    let html = `

      <div class="card">

        <h2 class="center">
          اختار الشخصية السرية 🎭
        </h2>

        <p class="center small">
          اختار شخصية واحدة ثم اضغط تأكيد
        </p>

        <div class="characters">
    `;

    characters.forEach((name, i) => {

      html += `

        <div
          class="character"
          onclick="selectCharacter(${i}, this)"
        >

          <div class="avatar">
            ${i + 1}
          </div>

          <div class="name">
            ${name}
          </div>

        </div>

      `;

    });

    html += `

        </div>

        <button
          class="primary"
          onclick="confirmCharacter()"
        >
          تأكيد الشخصية
        </button>

      </div>

    `;

    document.getElementById("home").innerHTML = html;

  }


  function selectCharacter(i, el) {

    selected = i;

    document
      .querySelectorAll(".character")
      .forEach(x => x.classList.remove("selected"));

    el.classList.add("selected");

  }


  /* =========================
     تأكيد الشخصية
  ========================= */

  function confirmCharacter() {

    if (selected === null) {

      alert("اختار شخصية الأول");

      return;
    }

    mySecret = selected;

    send({
      type: "secret_selected",
      character: selected
    });

    document.getElementById("home").innerHTML = `

      <div class="card center">

        <h2>
          تم اختيار الشخصية ✅
        </h2>

        <div class="status">
          في انتظار اللاعب الآخر...
        </div>

        <p class="small">
          الشخصية السرية الخاصة بك:
          ${characters[selected]}
        </p>

      </div>

    `;

  }


  /* =========================
     بداية اللعبة
  ========================= */

  function showGame(turn) {

    gameStarted = true;

    currentTurn = turn;

    eliminated = [];

    attempts = 3;

    document.getElementById("home").innerHTML = `

      <div class="card">

        <div
          id="turnBox"
          class="turn"
        >
          ${turn === player ? "دورك 🎯" : "دور الخصم ⏳"}
        </div>

        <h2 class="center">
          اللعبة بدأت 🔥
        </h2>

        <p class="center small">
          اسأل الخصم أسئلة تساعدك على استبعاد الشخصيات.
        </p>

        <div class="question-box">

          <textarea
            id="question"
            placeholder="اكتب سؤالك هنا..."
          ></textarea>

          <button
            id="questionButton"
            class="primary"
            onclick="sendQuestion()"
          >
            إرسال السؤال
          </button>

        </div>

        <div
          id="messages"
        ></div>

        <div class="card">

          <h3 class="center">
            الشخصيات
          </h3>

          <p class="center small">
            اضغط على الشخصية لاستبعادها
          </p>

          <div
            id="gameCharacters"
            class="characters"
          ></div>

          <button
            id="finishTurnButton"
            class="success"
            onclick="finishTurn()"
          >
            إنهاء دورك ➡️
          </button>

        </div>

        <div class="guess-box">

          <h3 class="center">
            تخمين الشخصية 🎯
          </h3>

          <div
            id="attempts"
            class="attempts"
          >
            محاولات التخمين المتبقية: 3
          </div>

          <select
            id="guessSelect"
            style="
              width:100%;
              padding:14px;
              border-radius:12px;
              background:#0f131b;
              color:white;
              border:1px solid #3a4354;
              font-size:16px;
            "
          >
          </select>

          <button
            id="guessButton"
            class="danger"
            onclick="makeGuess()"
          >
            تخمين الشخصية
          </button>

        </div>

      </div>

    `;

    renderCharacters();

    updateTurnUI();

  }


  /* =========================
     رسم الشخصيات
  ========================= */

  function renderCharacters() {

    const box =
      document.getElementById("gameCharacters");

    if (!box) return;

    box.innerHTML = "";

    characters.forEach((name, i) => {

      const div =
        document.createElement("div");

      div.className = "character";

      if (eliminated.includes(i)) {
        div.classList.add("eliminated");
      }

      div.innerHTML = `

        <div class="avatar">
          ${i + 1}
        </div>

        <div class="name">
          ${name}
        </div>

      `;

      div.onclick = function() {

        if (currentTurn !== player) {

          alert("مش دورك دلوقتي.");

          return;
        }

        toggleEliminate(i);

      };

      box.appendChild(div);

    });

    const select =
      document.getElementById("guessSelect");

    if (select) {

      select.innerHTML =
        `<option value="">اختار شخصية للتخمين</option>`;

      characters.forEach((name, i) => {

        if (!eliminated.includes(i)) {

          const option =
            document.createElement("option");

          option.value = i;

          option.textContent = name;

          select.appendChild(option);

        }

      });

    }

  }


  /* =========================
     استبعاد شخصية
  ========================= */

  function toggleEliminate(i) {

    if (eliminated.includes(i)) {

      eliminated =
        eliminated.filter(x => x !== i);

    } else {

      eliminated.push(i);

    }

    renderCharacters();

  }


  /* =========================
     إنهاء الدور
  ========================= */

  function finishTurn() {

    if (currentTurn !== player) {

      alert("مش دورك.");

      return;
    }

    send({
      type: "end_turn"
    });

  }


  /* =========================
     السؤال
  ========================= */

  function sendQuestion() {

    if (currentTurn !== player) {

      alert("مش دورك دلوقتي.");

      return;
    }

    const box =
      document.getElementById("question");

    if (!box) return;

    const text =
      box.value.trim();

    if (!text) {

      alert("اكتب السؤال الأول.");

      return;
    }

    send({
      type: "question",
      text: text
    });

    box.value = "";

  }


  /* =========================
     التخمين
  ========================= */

  function makeGuess() {

    if (currentTurn !== player) {

      alert("مش دورك دلوقتي.");

      return;
    }

    if (attempts <= 0) {

      alert("انتهت محاولات التخمين.");

      return;
    }

    const select =
      document.getElementById("guessSelect");

    if (!select || select.value === "") {

      alert("اختار شخصية للتخمين.");

      return;
    }

    const character =
      Number(select.value);

    send({
      type: "guess",
      character: character
    });

  }


  /* =========================
     تحديث الدور
  ========================= */

  function updateTurnUI() {

    const turnBox =
      document.getElementById("turnBox");

    const questionButton =
      document.getElementById("questionButton");

    const finishButton =
      document.getElementById("finishTurnButton");

    const guessButton =
      document.getElementById("guessButton");

    if (turnBox) {

      turnBox.textContent =
        currentTurn === player
          ? "دورك 🎯"
          : "دور الخصم ⏳";

    }

    const myTurn =
      currentTurn === player;

    if (questionButton)
      questionButton.disabled = !myTurn;

    if (finishButton)
      finishButton.disabled = !myTurn;

    if (guessButton)
      guessButton.disabled =
        !myTurn || attempts <= 0;

  }


  /* =========================
     الرسائل
  ========================= */

  function addMessage(text) {

    const box =
      document.getElementById("messages");

    if (!box) return;

    const message =
      document.createElement("div");

    message.className = "message";

    message.textContent = text;

    box.appendChild(message);

  }


  /* =========================
     شاشة الفوز
  ========================= */

  function showWinner(text) {

    document.getElementById("home").innerHTML = `

      <div class="card center">

        <h1>
          🏆
        </h1>

        <h2>
          ${text}
        </h2>

        <button
          class="primary"
          onclick="location.reload()"
        >
          مباراة جديدة
        </button>

      </div>

    `;

  }


  /* =========================
     الاتصال بالسيرفر
  ========================= */

  function connect() {

    try {

      const protocol =
        location.protocol === "https:"
          ? "wss:"
          : "ws:";

      const wsUrl =
        protocol +
        "//" +
        location.host;

      socket =
        new WebSocket(wsUrl);

      socket.onopen = function() {

        connected = true;

        const status =
          document.getElementById("connectionStatus");

        if (status) {

          status.textContent =
            "متصل بالخادم ✅";

        }

      };


      socket.onmessage = function(event) {

        let data;

        try {

          data =
            JSON.parse(event.data);

        } catch (e) {

          console.log(
            "رسالة غير مفهومة:",
            event.data
          );

          return;
        }

        handleMessage(data);

      };


      socket.onclose = function() {

        connected = false;

        const status =
          document.getElementById("connectionStatus");

        if (status) {

          status.textContent =
            "انقطع الاتصال بالخادم ❌";

        }

      };


      socket.onerror = function() {

        connected = false;

        console.log(
          "WebSocket error"
        );

      };

    } catch (error) {

      console.error(error);

    }

  }


  /* =========================
     إرسال للسيرفر
  ========================= */

  function send(data) {

    if (
      !socket ||
      socket.readyState !== WebSocket.OPEN
    ) {

      alert("الاتصال بالخادم غير متاح.");

      return;

    }

    socket.send(
      JSON.stringify(data)
    );

  }


  /* =========================
     استقبال رسائل السيرفر
  ========================= */

  function handleMessage(data) {

    console.log(
      "SERVER:",
      data
    );


    /* اللاعب */

    if (data.type === "player") {

      player =
        data.player;

      return;

    }


    /* الغرفة */

    if (
      data.type === "room_created" ||
      data.type === "created"
    ) {

      room =
        String(data.room || "").toUpperCase();

      showRoom();

      return;

    }


    /* دخول الغرفة */

    if (
      data.type === "joined" ||
      data.type === "join_success"
    ) {

      if (data.room)
        room =
          String(data.room).toUpperCase();

      addMessage(
        "تم الدخول إلى الغرفة ✅"
      );

      return;

    }


    /* بداية اختيار الشخصيات */

    if (
      data.type === "choose_character" ||
      data.type === "select_character" ||
      data.type === "start_selection"
    ) {

      showCharacters();

      return;

    }


    /* بداية اللعبة */

    if (
      data.type === "game_start" ||
      data.type === "start_game"
    ) {

      if (data.turn !== undefined)
        currentTurn = data.turn;

      showGame(currentTurn);

      return;

    }


    /* تحديث الدور */

    if (
      data.type === "turn" ||
      data.type === "turn_changed"
    ) {

      currentTurn =
        data.turn;

      updateTurnUI();

      return;

    }


    /* سؤال */

    if (data.type === "question") {

      addMessage(
        "❓ " +
        (data.text || "")
      );

      return;

    }


    /* إجابة */

    if (data.type === "answer") {

      addMessage(
        "💬 " +
        (data.text || data.answer || "")
      );

      return;

    }


    /* استبعاد */

    if (
      data.type === "eliminated" ||
      data.type === "eliminate"
    ) {

      if (
        data.character !== undefined &&
        !eliminated.includes(data.character)
      ) {

        eliminated.push(
          data.character
        );

        renderCharacters();

      }

      return;

    }


    /* نتيجة التخمين */

    if (
      data.type === "guess_result"
    ) {

      if (data.correct === true) {

        showWinner(
          "🎉 مبروك! خمنت الشخصية الصحيحة!"
        );

        return;

      }

      attempts--;

      const attemptsBox =
        document.getElementById("attempts");

      if (attemptsBox) {

        attemptsBox.textContent =
          "محاولات التخمين المتبقية: " +
          attempts;

      }

      if (attempts <= 0) {

        showWinner(
          "❌ انتهت محاولاتك! الخصم فاز."
        );

      } else {

        alert(
          "❌ التخمين غلط! باقي لك " +
          attempts +
          " محاولات."
        );

      }

      updateTurnUI();

      return;

    }


    /* فوز */

    if (
      data.type === "winner" ||
      data.type === "win"
    ) {

      showWinner(
        data.message ||
        "🏆 أنت الفائز!"
      );

      return;

    }


    /* خسارة */

    if (
      data.type === "loser" ||
      data.type === "lose"
    ) {

      showWinner(
        data.message ||
        "❌ خسرت المباراة."
      );

      return;

    }


    /* خطأ */

    if (data.type === "error") {

      alert(
        data.message ||
        "حدث خطأ."
      );

      return;

    }

  }


  /* =========================
     تشغيل اللعبة
  ========================= */

  showHome();

  connect();

</script>

</body>
</html>
