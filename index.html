<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>يلا نصفي 🎭</title>
<style>
*{box-sizing:border-box} :root{--bg:#090d18;--card:#111827;--card2:#172033;--line:#26324a;--text:#fff;--muted:#9eabc0;--blue:#3567ff;--red:#ef4444;--green:#16a36a}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#172554 0,#090d18 45%,#060912 100%);color:var(--text);min-height:100vh}
button,input,textarea,select{font-family:inherit} button{border:0;border-radius:15px;padding:15px 18px;font-size:17px;font-weight:700;cursor:pointer;transition:.15s}button:active{transform:scale(.98)}button:disabled{opacity:.4;cursor:not-allowed}.container{width:100%;max-width:980px;margin:auto;padding:16px}.card{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:16px;box-shadow:0 16px 45px rgba(0,0,0,.28)}.center{text-align:center}.logo{font-size:42px;font-weight:900;letter-spacing:-1px;margin-bottom:8px}.logo span{display:inline-block}.subtitle{color:var(--muted);font-size:16px;margin-bottom:22px}.primary{background:linear-gradient(135deg,#4774ff,#2851e9);color:#fff}.secondary{background:#202a3d;color:#fff}.danger{background:linear-gradient(135deg,#ef5350,#c62828);color:#fff}.success{background:linear-gradient(135deg,#1db77b,#087f52);color:#fff}.room{font-size:42px;font-weight:900;letter-spacing:7px;color:#82a1ff;margin:18px 0}.status,.turn{padding:13px 15px;border-radius:14px;background:#1c2638;color:#dbe4f5;margin:12px 0;text-align:center}.turn{font-weight:900;border:1px solid #30415f}.small{color:var(--muted);font-size:14px}input,textarea,select{width:100%;background:#0b1220;color:#fff;border:1px solid #31405b;border-radius:14px;padding:14px;font-size:17px;outline:none;margin-bottom:12px}textarea{min-height:95px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#5d7eff}.actions{display:grid;gap:10px}.characters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}.character{background:#172033;border:2px solid transparent;border-radius:17px;padding:8px;cursor:pointer;transition:.15s;min-width:0}.character:hover{transform:translateY(-2px);border-color:#3d5278}.character.selected{border-color:#6e8cff;background:#233354}.character.eliminated{opacity:.28;filter:grayscale(1)}.avatar{width:100%;aspect-ratio:1;border-radius:13px;overflow:hidden;background:#26334c;display:flex;align-items:center;justify-content:center;font-weight:900;color:#aab8d0}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.name{margin-top:7px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message{background:#1b2639;border-radius:12px;padding:11px 13px;margin-top:9px;border-right:3px solid #5578ff}.message.answer{border-right-color:#27b77c}.guess-box{background:#0f1727;border:1px solid #273651;border-radius:18px;padding:16px;margin-top:18px}.attempts{text-align:center;font-size:17px;margin:12px 0;font-weight:700}.hidden{display:none!important}.brand-mark{font-size:58px;margin-bottom:6px}.section-title{margin-bottom:4px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#1d2a42;border:1px solid #30425f;padding:7px 10px;border-radius:999px;font-size:12px;color:#c8d4e8}
@media(max-width:760px){.characters{grid-template-columns:repeat(4,1fr)}}@media(max-width:520px){.container{padding:10px}.card{padding:16px;border-radius:20px}.logo{font-size:34px}.characters{grid-template-columns:repeat(3,1fr);gap:8px}.character{padding:6px}.name{font-size:12px}.room{font-size:36px}}
</style></head><body><div class="container"><div id="home"></div></div>
<script>
let socket=null,room="",player=null,selected=null,characters=[],currentTurn=null,eliminated=[],attempts=3,connected=false,gameStarted=false;
function showHome(){document.getElementById('home').innerHTML=`<div class="card center"><div class="brand-mark">⚔️</div><div class="logo">يلا نصفي 🎭</div><div class="subtitle">لعبة تخمين الشخصيات — لاعب ضد لاعب</div><div class="actions"><button class="primary" onclick="createGame()">إنشاء مباراة 🎮</button><button class="secondary" onclick="showJoin()">الانضمام لمباراة 🔑</button></div><div id="connectionStatus" class="status">جاري الاتصال بالخادم...</div></div>`}
function showJoin(){document.getElementById('home').innerHTML=`<div class="card center"><h2>الانضمام لمباراة 🔑</h2><p class="small">اكتب كود المباراة الذي أرسله لك صاحب الغرفة</p><input id="roomInput" placeholder="مثال: A7K2P" maxlength="5" autocomplete="off"><button class="primary" onclick="joinGame()">دخول المباراة</button><button class="secondary" onclick="showHome()">رجوع</button></div>`}
function createGame(){if(!connected)return alert('لسه جاري الاتصال بالخادم، حاول بعد ثواني.');send({type:'create'})}
function joinGame(){const box=document.getElementById('roomInput');if(!box)return;const code=box.value.trim().toUpperCase();if(!code)return alert('اكتب كود الغرفة');room=code;send({type:'join',room:code})}
function showRoom(){document.getElementById('home').innerHTML=`<div class="card center"><div class="brand-mark">🎮</div><h2>المباراة جاهزة</h2><div class="room">${room}</div><p>ابعت الكود للاعب الثاني</p><div class="status">في انتظار اللاعب الثاني...</div><p class="small">بمجرد دخوله هنبدأ اختيار الشخصيات.</p></div>`}
function showCharacters(){selected=null;let html=`<div class="card"><div class="center"><h2 class="section-title">اختار شخصيتك السرية 🎭</h2><p class="small">كل مباراة بتختار 30 شخصية عشوائية من مكتبة الشخصيات.</p></div><div class="characters">`;characters.forEach((c,i)=>html+=`<div class="character" onclick="selectCharacter(${i},this)"><div class="avatar"><img src="${c.image}" alt="${c.name}" loading="lazy"></div><div class="name">${c.name}</div></div>`);html+=`</div><button class="primary" onclick="confirmCharacter()">تأكيد الشخصية ✅</button></div>`;document.getElementById('home').innerHTML=html}
function selectCharacter(i,el){selected=i;document.querySelectorAll('.character').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function confirmCharacter(){if(selected===null)return alert('اختار شخصية الأول');send({type:'secret_selected',character:selected});document.getElementById('home').innerHTML=`<div class="card center"><div class="brand-mark">🔒</div><h2>تم اختيار الشخصية</h2><div class="status">مستني اللاعب الآخر يختار...</div><p class="small">شخصيتك السرية: <b>${characters[selected].name}</b></p></div>`}
function showGame(turn){gameStarted=true;currentTurn=turn;eliminated=[];attempts=3;document.getElementById('home').innerHTML=`<div class="card"><div class="topbar"><div class="pill">يلا نصفي</div><div id="turnBox" class="turn" style="margin:0;flex:1">${turn===player?'دورك 🎯':'دور الخصم ⏳'}</div></div><div class="center"><h2>اللعبة بدأت 🔥</h2><p class="small">اسأل — استبعد — خمّن. عندك 3 محاولات تخمين.</p></div><div class="question-box"><textarea id="question" placeholder="مثال: هل الشخصية راجل؟ هل هي ممثل؟"></textarea><button id="questionButton" class="primary" onclick="sendQuestion()">إرسال السؤال</button></div><div id="messages"></div><div class="card"><h3 class="center">الشخصيات</h3><p class="center small">اضغط على الشخصية لاستبعادها لو السؤال استبعدها.</p><div id="gameCharacters" class="characters"></div><button id="finishTurnButton" class="success" onclick="finishTurn()">إنهاء دورك ➡️</button></div><div class="guess-box"><h3 class="center">تخمين الشخصية 🎯</h3><div id="attempts" class="attempts">محاولات التخمين المتبقية: 3</div><select id="guessSelect"><option value="">اختار شخصية للتخمين</option></select><button id="guessButton" class="danger" onclick="makeGuess()">تخمين الشخصية</button></div></div>`;renderCharacters();updateTurnUI()}
function renderCharacters(){const box=document.getElementById('gameCharacters');if(!box)return;box.innerHTML='';characters.forEach((c,i)=>{const div=document.createElement('div');div.className='character'+(eliminated.includes(i)?' eliminated':'');div.innerHTML=`<div class="avatar"><img src="${c.image}" alt="${c.name}" loading="lazy"></div><div class="name">${c.name}</div>`;div.onclick=()=>{if(currentTurn!==player)return alert('مش دورك دلوقتي.');toggleEliminate(i)};box.appendChild(div)});const select=document.getElementById('guessSelect');if(select){select.innerHTML='<option value="">اختار شخصية للتخمين</option>';characters.forEach((c,i)=>{if(!eliminated.includes(i)){const o=document.createElement('option');o.value=i;o.textContent=c.name;select.appendChild(o)}})}}
function toggleEliminate(i){if(eliminated.includes(i))eliminated=eliminated.filter(x=>x!==i);else eliminated.push(i);renderCharacters()}
function finishTurn(){if(currentTurn!==player)return alert('مش دورك.');send({type:'end_turn'})}
function sendQuestion(){if(currentTurn!==player)return alert('مش دورك دلوقتي.');const box=document.getElementById('question');if(!box)return;const text=box.value.trim();if(!text)return alert('اكتب السؤال الأول.');send({type:'question',text});box.value=''}
function makeGuess(){if(currentTurn!==player)return alert('مش دورك دلوقتي.');if(attempts<=0)return alert('انتهت محاولات التخمين.');const select=document.getElementById('guessSelect');if(!select||select.value==='')return alert('اختار شخصية للتخمين.');send({type:'guess',character:Number(select.value)})}
function updateTurnUI(){const myTurn=currentTurn===player;const t=document.getElementById('turnBox'),q=document.getElementById('questionButton'),f=document.getElementById('finishTurnButton'),g=document.getElementById('guessButton');if(t)t.textContent=myTurn?'دورك 🎯':'دور الخصم ⏳';if(q)q.disabled=!myTurn;if(f)f.disabled=!myTurn;if(g)g.disabled=!myTurn||attempts<=0}
function addMessage(text,answer=false){const box=document.getElementById('messages');if(!box)return;const m=document.createElement('div');m.className='message'+(answer?' answer':'');m.textContent=text;box.appendChild(m)}
function showWinner(text,win=false){document.getElementById('home').innerHTML=`<div class="card center"><div class="brand-mark">${win?'🏆':'🎭'}</div><h2>${text}</h2><p class="small">تقدر تبدأ مباراة جديدة في أي وقت.</p><button class="primary" onclick="location.reload()">مباراة جديدة</button></div>`}
function connect(){try{const protocol=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(protocol+'//'+location.host);socket.onopen=()=>{connected=true;const s=document.getElementById('connectionStatus');if(s)s.textContent='متصل بالخادم ✅'};socket.onmessage=e=>{try{handleMessage(JSON.parse(e.data))}catch(err){console.error(err)}};socket.onclose=()=>{connected=false;const s=document.getElementById('connectionStatus');if(s)s.textContent='انقطع الاتصال بالخادم ❌'};socket.onerror=()=>{connected=false}}catch(e){console.error(e)}}
function send(data){if(!socket||socket.readyState!==WebSocket.OPEN)return alert('الاتصال بالخادم غير متاح.');socket.send(JSON.stringify(data))}
function handleMessage(data){console.log('SERVER:',data);if(data.type==='created'){room=String(data.room).toUpperCase();player=data.player;showRoom();return}if(data.type==='joined'){player=data.player;if(data.room)room=String(data.room).toUpperCase();return}if(data.type==='room_ready'){characters=data.characters||[];if(characters.length!==30)return alert('حصلت مشكلة في تحميل الشخصيات.');showCharacters();return}if(data.type==='secret_confirmed')return;if(data.type==='game_start'){characters=data.characters||characters;currentTurn=data.turn;showGame(currentTurn);return}if(data.type==='game_state'){if(data.turn!==undefined)currentTurn=data.turn;if(data.guessesLeft!==undefined&&currentTurn===player){attempts=data.guessesLeft;const a=document.getElementById('attempts');if(a)a.textContent='محاولات التخمين المتبقية: '+attempts}updateTurnUI();return}if(data.type==='turn_changed'){currentTurn=data.turn;attempts=3;const a=document.getElementById('attempts');if(a)a.textContent='محاولات التخمين المتبقية: 3';updateTurnUI();return}if(data.type==='question'){addMessage((data.from===player?'❓ أنت: ':'❓ الخصم: ')+data.text);return}if(data.type==='answer'){addMessage((data.from===player?'💬 أنت: ':'💬 الخصم: ')+data.answer,true);return}if(data.type==='wrong_guess'){attempts=data.guessesLeft;const a=document.getElementById('attempts');if(a)a.textContent='محاولات التخمين المتبقية: '+attempts;alert('❌ التخمين غلط! باقي لك '+attempts+' محاولات.');updateTurnUI();return}if(data.type==='game_over'){const iWon=data.winner===player;showWinner(iWon?'🎉 مبروك! أنت الفائز!':'❌ انتهت المباراة — الخصم فاز.',iWon);return}if(data.type==='player_left'){showWinner('الخصم غادر المباراة.');return}if(data.type==='error')return alert(data.message||'حدث خطأ.')}
showHome();connect();
</script></body></html>
