<style>
*{box-sizing:border-box}:root{--bg:#050914;--panel:rgba(14,22,40,.88);--panel2:#111c31;--line:#2a3b5d;--text:#f8fbff;--muted:#9aa9c3;--blue:#3d73ff;--blue2:#244de0;--red:#ef4b57;--green:#16b879;--gold:#ffc84d;--cyan:#52d6ff}
html{background:var(--bg)}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,#173477 0,#0b1430 27%,#050914 68%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(61,115,255,.08),transparent 40%,rgba(239,75,87,.06));z-index:-1}
button,input,textarea,select{font-family:inherit}button{border:0;border-radius:17px;padding:15px 18px;font-size:17px;font-weight:900;cursor:pointer;transition:transform .14s,filter .14s,box-shadow .14s}button:active{transform:scale(.975)}button:hover:not(:disabled){filter:brightness(1.08)}button:disabled{opacity:.38;cursor:not-allowed}.container{width:100%;max-width:1000px;margin:auto;padding:14px}.card{background:linear-gradient(180deg,rgba(18,29,51,.94),rgba(10,17,31,.94));border:1px solid rgba(89,116,164,.35);border-radius:28px;padding:22px;margin-top:14px;box-shadow:0 22px 65px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(12px)}.center{text-align:center}.brand{display:flex;justify-content:center;align-items:center;gap:10px}.brand-mark{font-size:58px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3));margin-bottom:2px}.logo{font-size:42px;font-weight:1000;letter-spacing:-1px;margin:4px 0}.logo .blue{color:#73a0ff}.subtitle{color:var(--muted);font-size:16px;line-height:1.8;margin:8px auto 22px;max-width:620px}.hero{padding:30px 18px 24px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(61,115,255,.13);filter:blur(25px);left:-100px;top:-100px}.primary{background:linear-gradient(135deg,#4d7dff,#244fe3);color:#fff;box-shadow:0 12px 28px rgba(36,79,227,.3)}.secondary{background:linear-gradient(135deg,#1b2a43,#142238);color:#fff;border:1px solid #2b3d5d}.danger{background:linear-gradient(135deg,#ff5d67,#c82f3d);color:#fff;box-shadow:0 10px 25px rgba(200,47,61,.22)}.success{background:linear-gradient(135deg,#20c786,#078556);color:#fff}.ghost{background:transparent;color:#dce7fb;border:1px solid #304361}.actions{display:grid;gap:11px;max-width:600px;margin:0 auto}.status{padding:12px 15px;border-radius:15px;background:#142138;border:1px solid #2b3d5d;color:#dbe7fb;margin:15px 0;text-align:center}.status.ok{border-color:rgba(22,184,121,.45);color:#b9f5dc}.room{font-size:44px;font-weight:1000;letter-spacing:8px;color:#83a7ff;margin:16px 0;text-shadow:0 0 25px rgba(83,130,255,.28)}.small{color:var(--muted);font-size:14px;line-height:1.8}.section-title{margin:0 0 5px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.pill{background:#172640;border:1px solid #314667;padding:8px 12px;border-radius:999px;font-size:12px;color:#d5e1f4}.turn{padding:11px 14px;border-radius:14px;background:#172640;color:#e6efff;text-align:center;font-weight:900;border:1px solid #304667}.turn.myturn{border-color:rgba(22,184,121,.55);box-shadow:0 0 0 3px rgba(22,184,121,.08)}input,textarea,select{width:100%;background:#091321;color:#fff;border:1px solid #2d405f;border-radius:15px;padding:14px;font-size:17px;outline:none;margin-bottom:10px}input:focus,textarea:focus,select:focus{border-color:#5f86ff;box-shadow:0 0 0 3px rgba(95,134,255,.1)}textarea{min-height:95px;resize:vertical}.actions-inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}.characters{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-top:16px}.character{position:relative;background:linear-gradient(180deg,#182641,#101a2d);border:2px solid transparent;border-radius:18px;padding:7px;cursor:pointer;transition:.16s;min-width:0;overflow:hidden}.character:hover{transform:translateY(-2px);border-color:#40577e}.character.selected{border-color:#6f93ff;background:#23355a;box-shadow:0 0 0 4px rgba(111,147,255,.11)}.character.secret-picked{border-color:var(--gold);background:linear-gradient(180deg,#3b321a,#17243c);box-shadow:0 0 0 4px rgba(255,200,77,.12),0 8px 25px rgba(255,200,77,.12)}.character.secret-picked:before{content:"★ شخصيتك";position:absolute;z-index:2;top:7px;right:7px;background:var(--gold);color:#1a1404;font-size:10px;font-weight:1000;padding:5px 7px;border-radius:999px}.character.eliminated{opacity:.24;filter:grayscale(1);transform:none}.avatar{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#253450;display:flex;align-items:center;justify-content:center;font-weight:900;color:#aab8d0}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.name{margin-top:7px;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selection-banner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(255,200,77,.12),rgba(61,115,255,.08));border:1px solid rgba(255,200,77,.38);border-radius:20px;padding:12px;margin:14px 0}.selection-banner .mini-avatar{width:64px;height:64px;border-radius:14px;overflow:hidden;border:2px solid var(--gold);flex:0 0 auto}.mini-avatar img{width:100%;height:100%;object-fit:cover}.selection-banner b{color:#ffd36e}.guess-box,.question-box{background:linear-gradient(180deg,#0e192b,#0a1322);border:1px solid #273957;border-radius:20px;padding:16px;margin-top:16px}.attempts{text-align:center;font-size:16px;margin:11px 0;font-weight:900}.message{background:#17243a;border-radius:15px;padding:12px 14px;margin-top:9px;border-right:4px solid #5d80ff;line-height:1.7}.message.answer{border-right-color:#24bf88}.answer-box{margin-top:10px;padding:12px;border-radius:16px;background:#111f35;border:1px dashed #3e577d}.resume-overlay{position:fixed;inset:0;background:rgba(2,6,16,.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}.resume-modal{width:min(460px,100%);background:linear-gradient(180deg,#17253d,#0b1424);border:1px solid #3b5379;border-radius:26px;padding:25px;box-shadow:0 30px 80px rgba(0,0,0,.55);text-align:center}.resume-modal h2{margin:8px 0}.resume-code{font-size:32px;font-weight:1000;letter-spacing:6px;color:#82a7ff;margin:14px 0}.hidden{display:none!important}.divider{height:1px;background:#243550;margin:18px 0}.profile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.profile-avatar{position:relative;border:2px solid transparent;border-radius:18px;background:#101c31;padding:5px;cursor:pointer}.profile-avatar img{display:block;width:100%;aspect-ratio:1;border-radius:14px}.profile-avatar.selected{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,200,77,.12)}.profile-avatar.selected:after{content:"✓";position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#151005;display:grid;place-items:center;font-weight:1000}.profile-preview{width:96px;height:96px;border-radius:28px;border:3px solid var(--gold);overflow:hidden;margin:0 auto 12px;box-shadow:0 12px 30px rgba(0,0,0,.3)}.profile-preview img{width:100%;height:100%;object-fit:cover}.player-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:#111f35;border:1px solid #2b405f}.player-avatar{width:52px;height:52px;border-radius:15px;overflow:hidden;flex:0 0 auto;border:2px solid #3d73ff}.player-avatar img{width:100%;height:100%;object-fit:cover}.players-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:16px 0}.players-vs .vs{font-size:25px;font-weight:1000;color:#ffc84d}.profile-name{font-weight:1000;font-size:16px}.profile-role{font-size:11px;color:var(--muted);margin-top:3px}@media(max-width:520px){.profile-grid{grid-template-columns:repeat(4,1fr);gap:7px}.profile-avatar{border-radius:14px;padding:4px}.profile-avatar img{border-radius:11px}.players-vs{gap:6px}}
@media(max-width:760px){.characters{grid-template-columns:repeat(4,1fr)}}@media(max-width:520px){.container{padding:9px}.card{padding:15px;border-radius:22px}.hero{padding:24px 14px}.logo{font-size:34px}.brand-mark{font-size:50px}.characters{grid-template-columns:repeat(3,1fr);gap:8px}.character{padding:6px}.name{font-size:12px}.room{font-size:36px}.actions-inline{grid-template-columns:1fr}.selection-banner .mini-avatar{width:58px;height:58px}}
.home-badges{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px auto 20px}.home-badge{padding:8px 11px;border-radius:999px;background:rgba(24,38,64,.82);border:1px solid #304666;color:#dce8fb;font-size:12px;font-weight:800}.home-badge.gold{border-color:rgba(255,200,77,.42);color:#ffd66f}.home-badge.green{border-color:rgba(22,184,121,.42);color:#aaf0d3}.home-footer{margin-top:18px;color:#7485a2;font-size:12px}.home-title{font-size:18px;margin:0;color:#eaf1ff}.hero-glow{position:absolute;right:-90px;bottom:-120px;width:260px;height:260px;border-radius:50%;background:rgba(239,75,87,.09);filter:blur(28px);pointer-events:none}.actions button{min-height:56px}.status{font-weight:700}.status::before{content:'●';margin-left:7px;color:#ffc84d}.status.ok::before{color:#16b879}@media(max-width:520px){.home-badges{gap:6px;margin-top:15px}.home-badge{font-size:11px;padding:7px 9px}.home-footer{font-size:11px}.home-title{font-size:16px}}.game-shell{padding:14px}.game-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.game-title{display:flex;align-items:center;gap:10px}.game-title>span{font-size:28px}.game-title b{display:block;font-size:19px}.game-title small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.game-turn{min-width:150px}.live-vs{margin:10px 0 14px}.live-vs .player-card{min-height:74px}.game-rule{text-align:center;padding:10px;border-radius:14px;background:linear-gradient(90deg,rgba(61,115,255,.12),rgba(239,75,87,.12));border:1px solid #2b3d5d;font-weight:900;color:#dce8fb}.box-heading{font-weight:1000;font-size:17px;margin-bottom:8px}.board-card{margin-top:14px;padding:14px}.game-shell .question-box,.game-shell .guess-box{box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.game-shell .characters{margin-top:12px}.game-shell .selection-banner{margin:12px 0}.game-shell .turn.myturn{animation:turnPulse 1.6s infinite}@keyframes turnPulse{0%,100%{box-shadow:0 0 0 3px rgba(22,184,121,.08)}50%{box-shadow:0 0 0 6px rgba(22,184,121,.16)}}@media(max-width:520px){.game-head{align-items:stretch}.game-turn{min-width:0;font-size:13px;padding:10px}.game-title b{font-size:17px}.game-title>span{font-size:24px}.live-vs .player-card{padding:8px}.live-vs .player-avatar{width:44px;height:44px}.live-vs .profile-name{font-size:13px}.live-vs .profile-role{font-size:10px}.live-vs .vs{font-size:19px}}.pick-status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 8px;padding:12px 14px;border-radius:16px;background:#101d33;border:1px solid #2e4263;color:#dfeaff;font-size:13px}.pick-status b{color:#ffd36e}.pick-count{padding:6px 9px;border-radius:999px;background:#1b2c49;color:#9fc0ff;font-weight:900}.pick-grid .character{box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.pick-grid .character.selected{transform:translateY(-2px) scale(1.01)}.pick-grid .character.selected:after{content:'✓';position:absolute;left:7px;bottom:7px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#6f93ff;color:#fff;font-weight:1000;box-shadow:0 4px 12px rgba(0,0,0,.35)}.selection-help{text-align:center;color:#8496b3;font-size:12px;margin-top:12px}.character-pick-card{overflow:hidden}.game-board-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.elimination-count{font-size:11px;color:#a9b9d2;background:#14233a;border:1px solid #2e4263;padding:7px 9px;border-radius:999px}.game-character-note{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0 10px}.game-character-note span{font-size:11px;padding:6px 9px;border-radius:999px;background:#14233a;border:1px solid #2d4162;color:#c8d5e8}.game-character-note .secret-note{border-color:rgba(255,200,77,.4);color:#ffd66f}.game-character-note .eliminated-note{border-color:rgba(239,75,87,.35);color:#ff9aa2}.character.eliminated:after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:1000;color:#ff5d67;text-shadow:0 3px 14px rgba(0,0,0,.6);background:rgba(5,9,20,.25)}@media(max-width:520px){.pick-status{font-size:12px}.pick-count{font-size:10px}.pick-grid{gap:7px}.pick-grid .character.selected:after{width:22px;height:22px;font-size:12px}}
.wallet{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.wallet-pill{padding:7px 11px;border-radius:999px;background:#111f35;border:1px solid #304667;font-size:12px;font-weight:1000}.wallet-pill.coin{color:#ffd66f;border-color:rgba(255,200,77,.35)}.wallet-pill.star{color:#a9c1ff;border-color:rgba(111,147,255,.35)}.reward-box{margin:14px 0;padding:15px;border-radius:20px;background:linear-gradient(135deg,rgba(255,200,77,.1),rgba(61,115,255,.1));border:1px solid rgba(255,200,77,.28)}.reward-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px}.reward{padding:9px 13px;border-radius:999px;background:#101d33;border:1px solid #304667;font-weight:1000}.reward.win{color:#ffd66f}.reward.lose{color:#b9f5dc}''</style>

<body><div class="container"><div id="home"></div></div>
<script>
let socket=null,room="",player=null,sessionToken=null,selected=null,mySecret=null,characters=[],currentTurn=null,currentPhase="ask",eliminated=[],attempts=3,connected=false,gameStarted=false,pendingQuestionFrom=null,resumeState=null,profile=null,roomPlayers=[];
const SESSION_KEY="yalla_nasafy_session_v2";
const PROFILE_KEY="yalla_nasafy_profile_v2";
const AVATARS=Array.from({length:12},(_,i)=>`avatars/avatar_${i+1}.svg`);

const AudioFX=(()=>{let ctx=null;function init(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();}catch(e){}}function tone(freq,dur=.07,type='sine',gain=.045,slide=0){init();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),now=ctx.currentTime;o.type=type;o.frequency.setValueAtTime(freq,now);if(slide)o.frequency.linearRampToValueAtTime(freq+slide,now+dur);g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+dur+.02)}return{click:()=>tone(520,.045,'square',.022),sendQuestion:()=>{tone(610,.07,'sine',.04,80);setTimeout(()=>tone(780,.08,'sine',.035,70),65)},receiveQuestion:()=>{tone(430,.08,'sine',.045,-50);setTimeout(()=>tone(360,.1,'sine',.04,-30),80)},sendAnswer:()=>{tone(520,.07,'triangle',.04,90);setTimeout(()=>tone(690,.09,'triangle',.035,60),65)},receiveAnswer:()=>{tone(360,.07,'triangle',.04,70);setTimeout(()=>tone(510,.1,'triangle',.035,90),65)}}})();
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.dataset.special)AudioFX.click()});

function saveProfile(){if(profile)localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));}
function getProfile(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||"null")}catch{return null}}
function saveSession(){if(room&&sessionToken)localStorage.setItem(SESSION_KEY,JSON.stringify({room,token:sessionToken,player,secret:mySecret,profile}));}
function clearSession(){localStorage.removeItem(SESSION_KEY);room="";sessionToken=null;player=null;}
function getSavedSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{return null}}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderAvatarPicker(){const box=document.getElementById('avatarPicker');if(!box)return;box.innerHTML=AVATARS.map((src,i)=>`<div class="profile-avatar ${profile?.avatar===i+1?'selected':''}" onclick="chooseAvatar(${i+1})"><img src="${src}" alt="صورة كرتونية ${i+1}"></div>`).join('')}
function chooseAvatar(i){if(!profile)profile={name:'',avatar:i};else profile.avatar=i;const preview=document.getElementById('profilePreview');if(preview)preview.innerHTML=`<img src="${AVATARS[i-1]}" alt="صورتك">`;renderAvatarPicker()}
function showCreateProfile(){const current=profile||{name:'',avatar:1,coins:0,stars:0};profile=current;document.getElementById('home').innerHTML=`<div class="card hero center"><div class="brand-mark">👤</div><h2>اعمل حسابك في يلا نصفي</h2><p class="small">اختار اسمك وصورتك الكرتونية مرة واحدة، وبعدها تدخل اللعبة على طول.</p><div id="profilePreview" class="profile-preview"><img src="${AVATARS[current.avatar-1]}" alt="صورتك"></div><input id="playerName" maxlength="24" value="${escapeHtml(current.name||'')}" placeholder="اكتب اسمك داخل اللعبة" autocomplete="nickname"><h3 class="section-title">اختار صورتك</h3><div id="avatarPicker" class="profile-grid"></div><button class="primary" data-special="1" onclick="saveProfileAndStart()">حفظ والبدء 🎮</button><p class="small">تقدر تغيّر الاسم أو الصورة من حسابك لاحقًا.</p></div>`;renderAvatarPicker()}
function saveProfileAndStart(){const name=document.getElementById('playerName')?.value.trim();if(!name)return alert('اكتب اسمك الأول.');if(name.length<2)return alert('الاسم لازم يكون حرفين على الأقل.');profile={name:name.slice(0,24),avatar:profile?.avatar||1,coins:Math.max(0,Math.floor(Number(profile?.coins)||0)),stars:Math.max(0,Math.floor(Number(profile?.stars)||0))};saveProfile();showHome()}
function showHome(){if(!profile){showCreateProfile();return}document.getElementById('home').innerHTML=`<div class="card hero center"><div class="hero-glow"></div><div class="brand-mark">👑</div><div class="logo">يلا <span class="blue">نصفي</span></div><div class="profile-preview" style="width:78px;height:78px;margin-top:8px"><img src="${AVATARS[profile.avatar-1]}" alt="${escapeHtml(profile.name)}"></div><h2 style="margin:4px 0">أهلًا ${escapeHtml(profile.name)} 👋</h2><div class="wallet"><span class="wallet-pill coin">🪙 ${profile.coins||0}</span><span class="wallet-pill star">⭐ ${profile.stars||0}</span></div><div class="actions"><button class="primary" data-special="1" onclick="createGame()">🎮 إنشاء مباراة</button><button class="secondary" data-special="1" onclick="showJoin()">🔑 الانضمام لمباراة</button></div><div id="connectionStatus" class="status">جاري الاتصال بالخادم...</div><button class="ghost" style="margin-top:10px" onclick="showCreateProfile()">✏️ تغيير الاسم أو الصورة</button></div>`}
function showJoin(){document.getElementById('home').innerHTML=`<div class="card center"><div class="brand-mark">🔑</div><h2>الانضمام لمباراة</h2><p class="small">اكتب كود المباراة الذي أرسله لك اللاعب الآخر</p><input id="roomInput" placeholder="مثال: A7K2P" maxlength="5" autocomplete="off"><div class="actions-inline"><button class="ghost" onclick="showHome()">رجوع</button><button class="primary" data-special="1" onclick="joinGame()">دخول المباراة</button></div></div>`}
function createGame(){if(!connected)return alert('لسه جاري الاتصال بالخادم، حاول بعد ثواني.');if(!profile)return showCreateProfile();clearSession();send({type:'create',profile})}
function joinGame(){const box=document.getElementById('roomInput');if(!box)return;const code=box.value.trim().toUpperCase();if(!code)return alert('اكتب كود الغرفة');if(!profile)return showCreateProfile();room=code;send({type:'join',room:code,profile})}
function playerCard(p,side){return `<div class="player-card"><div class="player-avatar" style="border-color:${side==='blue'?'#3d73ff':'#ef4b57'}"><img src="${AVATARS[(p.avatar||1)-1]}" alt="${escapeHtml(p.name||'لاعب')}"></div><div><div class="profile-name">${escapeHtml(p.name||'لاعب')}</div><div class="profile-role">${p.number===player?'أنت':'اللاعب الآخر'}</div></div></div>`}
function showRoom(){const p1=roomPlayers.find(p=>p.number===1)||{number:1,name:player===1?profile?.name:'في الانتظار',avatar:player===1?profile?.avatar:1};const p2=roomPlayers.find(p=>p.number===2)||{number:2,name:player===2?profile?.name:'في الانتظار',avatar:player===2?profile?.avatar:1};document.getElementById('home').innerHTML=`<div class="card hero center"><div class="brand-mark">🎮</div><h2>غرفة المباراة</h2><div class="room">${escapeHtml(room)}</div><button class="secondary" onclick="navigator.clipboard?.writeText(room);alert('تم نسخ الكود ✅')">مشاركة الكود 📋</button><div class="players-vs"><div>${playerCard(p1,'blue')}</div><div class="vs">VS</div><div>${playerCard(p2,'red')}</div></div><div class="status">${roomPlayers.filter(p=>p.connected).length<2?'في انتظار اللاعب الآخر...':'اللاعبان جاهزان ✅'}</div><p class="small">لو خرجت من اللعبة تقدر ترجع لنفس المباراة خلال 15 دقيقة.</p></div>`}
function showCharacters(){selected=mySecret!==null?mySecret:null;let html=`<div class="card character-pick-card"><div class="center"><div class="brand-mark">🎭</div><h2 class="section-title">اختار شخصيتك السرية</h2><p class="small">اختار شخصية واحدة من الـ30. الشخصية السرية هتفضل مميزة بالذهبي أثناء اللعب.</p></div><div class="pick-status"><span>🎯 اختيارك: <b id="selectedCharacterName">${selected!==null?escapeHtml(characters[selected]?.name||''): 'لم تختار بعد'}</b></span><span class="pick-count">30 شخصية</span></div><div class="characters pick-grid">`;characters.forEach((c,i)=>{let cls='character';if(selected===i)cls+=' selected';html+=`<div class="${cls}" data-index="${i}" onclick="selectCharacter(${i},this)"><div class="avatar"><img src="${c.image}" alt="${escapeHtml(c.name)}" loading="lazy"></div><div class="name">${escapeHtml(c.name)}</div></div>`});html+=`</div><div class="selection-help">💡 تقدر تضغط على الشخصية لتغيير اختيارك قبل التأكيد.</div><div class="divider"></div><button id="confirmCharacterButton" class="primary" data-special="1" onclick="confirmCharacter()" ${selected===null?'disabled':''}>تأكيد الشخصية ✅</button></div>`;document.getElementById('home').innerHTML=html}
function selectCharacter(i,el){selected=i;document.querySelectorAll('.character').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const n=document.getElementById('selectedCharacterName');if(n)n.textContent=characters[i]?.name||'';const b=document.getElementById('confirmCharacterButton');if(b)b.disabled=false;el.scrollIntoView({block:'nearest',behavior:'smooth'})}
function confirmCharacter(){if(selected===null)return alert('اختار شخصية الأول');mySecret=selected;send({type:'secret_selected',character:selected});document.getElementById('home').innerHTML=`<div class="card hero center"><div class="brand-mark">🔒</div><h2>تم اختيار الشخصية</h2><div class="selection-banner" style="text-align:right"><div class="mini-avatar"><img src="${characters[selected].image}" alt=""></div><div><div class="small">شخصيتك السرية</div><b>${escapeHtml(characters[selected].name)}</b></div></div><div class="status">مستني اللاعب الآخر يختار...</div><p class="small">الشخصية دي هتفضل متعلّمة عندك أثناء اللعب علشان تفتكر اختيارك.</p></div>`}
function showGame(turn,keepState=false){gameStarted=true;currentTurn=turn;currentPhase=keepState&&resumeState&&resumeState.phase?resumeState.phase:"ask";if(!keepState)eliminated=[];attempts=keepState&&resumeState?resumeState.guessesLeft:3;pendingQuestionFrom=null;const me=roomPlayers.find(p=>p.number===player)||{name:profile?.name||'أنت',avatar:profile?.avatar||1,number:player};const opponent=roomPlayers.find(p=>p.number!==player)||{name:'اللاعب الآخر',avatar:1,number:player===1?2:1};document.getElementById('home').innerHTML=`<div class="card game-shell"><div class="game-head"><div class="game-title"><span>🎭</span><div><b>يلا نصفي</b><small>مواجهة 1 ضد 1</small></div></div><div id="turnBox" class="turn game-turn">${turn===player?'دورك 🎯':'دور الخصم ⏳'}</div></div><div class="players-vs live-vs"><div id="meCard">${playerCard(me,'blue')}</div><div class="vs">VS</div><div id="oppCard">${playerCard(opponent,'red')}</div></div>${mySecret!==null?`<div class="selection-banner"><div class="mini-avatar"><img src="${characters[mySecret].image}" alt=""></div><div><div class="small">⭐ شخصيتك السرية</div><b>${escapeHtml(characters[mySecret].name)}</b><div class="small">متعلّمة عندك فقط</div></div></div>`:''}<div class="game-rule">اسأل ❓ → الخصم يجاوب 💬 → صفّي ❌ → أنهِ دورك ➡️</div><div id="phaseBox" class="status">جاري تجهيز الدور...</div><div class="question-box"><div class="box-heading">❓ اسأل خصمك</div><textarea id="question" placeholder="مثال: هل الشخصية راجل؟ هل هي ممثل؟"></textarea><button id="questionButton" class="primary" data-special="1" onclick="sendQuestion()">إرسال السؤال 📤</button></div><div id="answerArea"></div><div id="messages"></div><div class="card board-card"><div class="game-board-head"><div class="box-heading">🎭 الشخصيات</div><div id="eliminationCount" class="elimination-count">مستبعد: 0 / 29</div></div><div class="game-character-note"><span class="secret-note">⭐ شخصيتك السرية</span><span class="eliminated-note">✕ مستبعدة</span><span>اضغط على الشخصية لاستبعادها أو إلغاء الاستبعاد</span></div><div id="gameCharacters" class="characters"></div><button id="finishTurnButton" class="success" data-special="1" onclick="finishTurn()">إنهاء دورك ➡️</button></div><div class="guess-box"><div class="box-heading">🎯 خمن الشخصية السرية</div><div id="attempts" class="attempts">محاولات التخمين المتبقية: 3</div><select id="guessSelect"><option value="">اختار شخصية للتخمين</option></select><button id="guessButton" class="danger" data-special="1" onclick="makeGuess()">تخمين الشخصية</button></div></div>`;renderCharacters();updateTurnUI()}
function renderCharacters(){const box=document.getElementById('gameCharacters');if(!box)return;box.innerHTML='';characters.forEach((c,i)=>{const div=document.createElement('div');let cls='character';if(eliminated.includes(i))cls+=' eliminated';if(mySecret===i)cls+=' secret-picked';div.className=cls;div.innerHTML=`<div class="avatar"><img src="${c.image}" alt="${escapeHtml(c.name)}" loading="lazy"></div><div class="name">${escapeHtml(c.name)}</div>`;div.onclick=()=>{if(currentTurn!==player)return alert('مش دورك دلوقتي.');if(currentPhase!=='eliminate')return alert('بعد إجابة الخصم فقط تقدر تبدأ تصفية الشخصيات.');toggleEliminate(i)};box.appendChild(div)});const count=document.getElementById('eliminationCount');if(count)count.textContent='مستبعد: '+eliminated.filter(i=>i!==mySecret).length+' / 29';const select=document.getElementById('guessSelect');if(select){select.innerHTML='<option value="">اختار شخصية للتخمين</option>';characters.forEach((c,i)=>{if(!eliminated.includes(i)){const o=document.createElement('option');o.value=i;o.textContent=c.name;select.appendChild(o)}})}}
function toggleEliminate(i){if(i===mySecret)return alert('دي شخصيتك السرية ⭐ — سيبها واضحة علشان تفتكرها.');if(eliminated.includes(i))eliminated=eliminated.filter(x=>x!==i);else eliminated.push(i);send({type:'eliminate_state',eliminated});renderCharacters()}
function finishTurn(){if(currentTurn!==player)return alert('مش دورك.');if(currentPhase!=='eliminate')return alert('لازم الخصم يجاوب أولًا، وبعدها صفّي الشخصيات ثم أنهِ دورك.');send({type:'end_turn'})}
function sendQuestion(){if(currentTurn!==player)return alert('مش دورك دلوقتي.');if(currentPhase!=='ask')return alert('استنى إجابة سؤالك ثم صفّي الشخصيات قبل إنهاء الدور.');const box=document.getElementById('question');if(!box)return;const text=box.value.trim();if(!text)return alert('اكتب السؤال الأول.');send({type:'question',text});box.value='';AudioFX.sendQuestion()}
function showAnswerBox(text){const area=document.getElementById('answerArea');if(!area)return;area.innerHTML=`<div class="answer-box"><div class="small">📩 الخصم أرسل سؤالًا — اكتب إجابتك:</div><div class="message">❓ ${escapeHtml(text)}</div><input id="answerInput" placeholder="اكتب إجابة مختصرة مثل: نعم / لا / ممكن"><button class="primary" data-special="1" onclick="sendAnswer()">إرسال الإجابة 📤</button></div>`}
function sendAnswer(){if(!pendingQuestionFrom)return;const input=document.getElementById('answerInput');const answer=input?.value.trim();if(!answer)return alert('اكتب الإجابة الأول.');send({type:'answer',answer});pendingQuestionFrom=null;document.getElementById('answerArea').innerHTML='';AudioFX.sendAnswer()}
function makeGuess(){if(currentTurn!==player)return alert('مش دورك دلوقتي.');if(attempts<=0)return alert('انتهت محاولات التخمين.');const select=document.getElementById('guessSelect');if(!select||select.value==='')return alert('اختار شخصية للتخمين.');send({type:'guess',character:Number(select.value)})}
function updateTurnUI(){const myTurn=currentTurn===player;const t=document.getElementById('turnBox'),q=document.getElementById('questionButton'),f=document.getElementById('finishTurnButton'),g=document.getElementById('guessButton'),phaseBox=document.getElementById('phaseBox');let label='';if(!myTurn)label='دور الخصم ⏳';else if(currentPhase==='ask')label='دورك — اسأل سؤالًا ❓';else if(currentPhase==='answer')label='في انتظار إجابة الخصم 💬';else label='دورك — صفّي الشخصيات ❌ ثم أنهِ دورك';if(t){t.textContent=label;t.classList.toggle('myturn',myTurn)}if(q)q.disabled=!myTurn||currentPhase!=='ask';if(f)f.disabled=!myTurn||currentPhase!=='eliminate';if(g)g.disabled=!myTurn||currentPhase!=='eliminate'||attempts<=0;if(phaseBox){phaseBox.className='status'+(myTurn?' ok':'');phaseBox.textContent=!myTurn?'الخصم يلعب الآن — انتظر دوره.':currentPhase==='ask'?'اكتب سؤالك الحر وأرسله للخصم.':currentPhase==='answer'?'تم إرسال سؤالك — انتظر إجابة الخصم.': 'تمت الإجابة — الآن صفّي الشخصيات التي لا تنطبق عليها الإجابة، ثم اضغط «إنهاء دوري». ';}}
function addMessage(text,answer=false){const box=document.getElementById('messages');if(!box)return;const m=document.createElement('div');m.className='message'+(answer?' answer':'');m.textContent=text;box.appendChild(m);m.scrollIntoView({block:'nearest',behavior:'smooth'})}
function showWinner(text,win=false,reward=null){if(reward){profile={...(profile||{}),coins:Math.max(0,Math.floor(Number(profile?.coins)||0)+Number(reward.coins||0)),stars:Math.max(0,Math.floor(Number(profile?.stars)||0)+Number(reward.stars||0))};saveProfile();}clearSession();const r=reward?`<div class="reward-box"><b>مكافأة المباراة</b><div class="reward-row"><span class="reward win">🪙 +${reward.coins||0}</span><span class="reward win">⭐ +${reward.stars||0}</span></div></div>`:'';document.getElementById('home').innerHTML=`<div class="card hero center"><div class="brand-mark">${win?'🏆':'🎭'}</div><h2>${text}</h2>${r}<div class="wallet"><span class="wallet-pill coin">🪙 ${profile?.coins||0}</span><span class="wallet-pill star">⭐ ${profile?.stars||0}</span></div><p class="small">انتهت المباراة. تقدر تبدأ مباراة جديدة في أي وقت.</p><button class="primary" data-special="1" onclick="showHome()">مباراة جديدة 🔄</button></div>`}
function showResumeModal(){document.getElementById('home').innerHTML=`<div class="resume-overlay"><div class="resume-modal"><div class="brand-mark">🎮</div><h2>أنت في جيم بالفعل</h2><p class="small">لقينا مباراة مفتوحة مرتبطة بجهازك. تحب ترجع لها؟</p><div class="resume-code">${escapeHtml(room)}</div><div class="actions-inline"><button class="secondary" data-special="1" onclick="declineResume()">لا</button><button class="primary" data-special="1" onclick="acceptResume()">أرجع للجيم ✅</button></div></div></div>`}
function acceptResume(){send({type:'resume_accept'})}
function declineResume(){clearSession();send({type:'resume_decline'});showHome();setTimeout(connect,250)}
function connect(){try{const protocol=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(protocol+'//'+location.host);socket.onopen=()=>{connected=true;const s=document.getElementById('connectionStatus');if(s){s.textContent='متصل بالخادم ✅';s.classList.add('ok')}const saved=getSavedSession();if(saved){room=saved.room;sessionToken=saved.token;player=saved.player;send({type:'resume_probe',room,token:sessionToken})}};socket.onmessage=e=>{try{handleMessage(JSON.parse(e.data))}catch(err){console.error(err)}};socket.onclose=()=>{connected=false;const s=document.getElementById('connectionStatus');if(s)s.textContent='انقطع الاتصال بالخادم ❌';};socket.onerror=()=>{connected=false}}catch(e){console.error(e)}}
function send(data){if(!socket||socket.readyState!==WebSocket.OPEN)return alert('الاتصال بالخادم غير متاح.');socket.send(JSON.stringify(data))}
function handleMessage(data){console.log('SERVER:',data);
 if(data.type==='created'){room=String(data.room).toUpperCase();player=data.player;sessionToken=data.token;roomPlayers=data.players||[];profile=data.profile||profile;saveProfile();saveSession();showRoom();return}
 if(data.type==='joined'){player=data.player;if(data.room)room=String(data.room).toUpperCase();if(data.token)sessionToken=data.token;roomPlayers=data.players||roomPlayers;saveSession();showRoom();return}
 if(data.type==='resume_available'){showResumeModal();return}
 if(data.type==='resume_unavailable'){clearSession();showHome();return}
 if(data.type==='resumed'){room=String(data.room).toUpperCase();player=data.player;gameStarted=data.gameStarted;currentTurn=data.turn;currentPhase=data.phase||"ask";attempts=data.guessesLeft||3;mySecret=data.secretSelected?data.secret:null;characters=data.characters||characters;profile=data.profile||profile;roomPlayers=data.players||roomPlayers;resumeState={guessesLeft:attempts,phase:currentPhase,eliminated:Array.isArray(data.eliminated)?data.eliminated:[],messages:Array.isArray(data.messages)?data.messages:[],pendingQuestion:data.pendingQuestion};saveProfile();saveSession();return}
 if(data.type==='waiting_room'){roomPlayers=data.players||roomPlayers;showRoom();return}
 if(data.type==='room_ready'){characters=data.characters||[];roomPlayers=data.players||roomPlayers;if(characters.length!==30)return alert('حصلت مشكلة في تحميل الشخصيات.');showCharacters();return}
 if(data.type==='secret_confirmed'){if(selected!==null){mySecret=selected;saveSession()}return;}
 if(data.type==='game_start'){characters=data.characters||characters;roomPlayers=data.players||roomPlayers;currentTurn=data.turn;currentPhase=data.phase||"ask";gameStarted=true;const keep=!!data.resume&&!!resumeState; if(keep){eliminated=resumeState.eliminated||[];showGame(currentTurn,true);const box=document.getElementById('messages');if(box){box.innerHTML='';(resumeState.messages||[]).forEach(m=>addMessage((m.type==='question'?'❓ ':'💬 ')+(m.from===player?'أنت: ':'الخصم: ')+(m.text||m.answer||''),m.type==='answer'));} if(resumeState.pendingQuestion&&resumeState.pendingQuestion.from!==player)showAnswerBox(resumeState.pendingQuestion.text); resumeState=null; renderCharacters(); updateTurnUI();}else showGame(currentTurn);return}
 if(data.type==='game_state'){if(data.turn!==undefined)currentTurn=data.turn;if(data.phase!==undefined)currentPhase=data.phase;if(data.guessesLeft!==undefined&&currentTurn===player){attempts=data.guessesLeft;const a=document.getElementById('attempts');if(a)a.textContent='محاولات التخمين المتبقية: '+attempts}updateTurnUI();return}
 if(data.type==='turn_changed'){currentTurn=data.turn;currentPhase=data.phase||'ask';attempts=3;pendingQuestionFrom=null;const a=document.getElementById('attempts');if(a)a.textContent='محاولات التخمين المتبقية: 3';const aa=document.getElementById('answerArea');if(aa)aa.innerHTML='';updateTurnUI();return}
 if(data.type==='question'){currentPhase='answer';addMessage((data.from===player?'❓ أنت: ':'❓ الخصم: ')+data.text);if(data.from!==player){pendingQuestionFrom=data.from;showAnswerBox(data.text);AudioFX.receiveQuestion()}updateTurnUI();return}
 if(data.type==='answer'){currentPhase='eliminate';addMessage((data.from===player?'💬 أنت: ':'💬 الخصم: ')+data.answer,true);if(data.from!==player)AudioFX.receiveAnswer();updateTurnUI();return}
 if(data.type==='wrong_guess'){attempts=data.guessesLeft;const a=document.getElementById('attempts');if(a)a.textContent='محاولات التخمين المتبقية: '+attempts;alert('❌ التخمين غلط! باقي لك '+attempts+' محاولات.');updateTurnUI();return}
 if(data.type==='player_disconnected'){addMessage('⚠️ '+data.message);return}
 if(data.type==='game_over'){const iWon=data.winner===player;const reward=data.rewards?.[String(player)]||data.rewards?.[player]||null;if(data.profiles){const mine=data.profiles.find(x=>x.number===player);if(mine?.profile){profile=mine.profile;saveProfile();}}showWinner(iWon?'🎉 مبروك! أنت الفائز!':'❌ انتهت المباراة — الخصم فاز.',iWon,reward);return}
 if(data.type==='player_left'){addMessage('⚠️ الخصم غادر المباراة.');return}
 if(data.type==='error')return alert(data.message||'حدث خطأ.')}
profile=getProfile();showHome();connect();
</script></body></html>
